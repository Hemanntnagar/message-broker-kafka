# Default JavaStream broker settings (overridable via environment: JAVASTREAM_<KEY>)
environment=development
broker.id=0
network.listen.host=0.0.0.0
network.listen.port=9092
storage.data.dir=./data
storage.segment.max.bytes=134217728
storage.flush.policy=PERIODIC
storage.flush.interval.ms=1000
storage.index.stride.records=4096
cluster.enabled=false
cluster.coordinator.id=0
cluster.coordinator.host=127.0.0.1
cluster.coordinator.port=0
cluster.replication.factor=1
cluster.session.timeout.ms=15000
cluster.heartbeat.interval.ms=2000
network.replication.port=0
topic.default.partition.count=1
monitoring.http.host=127.0.0.1
monitoring.http.port=8080
admin.api.token=
security.client.auth.enabled=false
security.acl.enabled=false
security.max.message.bytes=1048576
security.max.connections=2048
network.max.request.bytes=1048576
network.tls.enabled=false
network.tls.keystore.path=
network.tls.keystore.password=
network.tls.keystore.type=PKCS12
