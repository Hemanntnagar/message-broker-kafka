# Default JavaStream broker settings (overridable via environment: JAVASTREAM_<KEY>)
environment=development
broker.id=0
network.listen.host=0.0.0.0
network.listen.port=9092
storage.data.dir=./data
storage.segment.max.bytes=134217728
storage.flush.policy=PERIODIC
storage.flush.interval.ms=1000
storage.index.stride.records=4096
cluster.enabled=false
topic.default.partition.count=1
